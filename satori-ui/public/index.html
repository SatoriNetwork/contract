<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="%PUBLIC_URL%/favicon-96x96.png" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <!-- Base.dev domain ownership. Base fetches app.satorinet.io and looks for this
         tag to prove we control the domain before letting the project claim it.
         Public by design: it identifies the Base.dev project, it is not a secret.
         DO NOT REMOVE — the verification is re-checked, so dropping it can
         un-verify the domain long after registration. -->
    <meta name="base:app_id" content="6a8094bce4a8a41598e7a37a" />
    <!-- iOS PWA: lets "Add to Home Screen" install a true standalone app
         instead of a Safari shortcut. The status-bar style sits over the
         dapp's dark theme, the title is the home-screen label. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Satori" />
    <!-- Android Chrome equivalent. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Satori" />
    <meta name="description" content="Satori, a daily on-chain prediction game. Predict the next value on any data stream, build streaks, earn rewards." />
    <meta property="og:title" content="Satori: Daily Prediction Game" />
    <meta property="og:description" content="Predict the next value on any data stream. Build streaks, earn rewards. Fully on-chain." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Satori: Daily Prediction Game" />
    <meta name="twitter:description" content="Predict the next value on any data stream. Build streaks, earn rewards. Fully on-chain." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!-- Fonts: Caveat (handwritten "daily" sub-brand) + Quicksand (the
         "Satori" wordmark) for the header, and Nunito as the app-matched body
         font for the rest of the UI. Loaded from Google's CDN with
         display=swap so the rest of the UI doesn't block on it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&amp;family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=Quicksand:wght@600;700&amp;display=swap" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- iOS PWA launch images. iOS only uses the entry whose media query
         matches the device exactly, so each phone/tablet class gets its own
         line with native resolution + CSS pixels + DPR. -->
