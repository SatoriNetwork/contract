server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Behind Caddy, which terminates TLS and already gzips. Compressing twice
    # just burns CPU on a box that has little to spare.
    gzip off;

    # CRA emits content-hashed asset filenames, so those can be cached forever —
    # a rebuild produces new names. index.html must NOT be cached, or a deploy is
    # invisible to anyone who has visited before.
    location /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # The service worker decides which bundle every returning visitor gets, so a
    # stale copy of THIS file outranks every other cache rule here. It was being
    # served with no Cache-Control at all, leaving browsers to guess from
    # Last-Modified. Browsers do force a revalidation of the SW script at least
    # daily, so an update lands eventually — but "eventually" is the wrong
    # setting for the file that controls cache invalidation, especially right
    # after a redeploy that changed contract addresses.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # A MISSING manifest must 404, not quietly become the app. Without this the
    # SPA fallback below answers /.well-known/farcaster.json with index.html and
    # a 200, so a validator reads "this is not JSON" when the truth is "the file
    # was never deployed" — two very different bugs that look identical from
    # outside. Same class of silent success as the Tailwind guard in Dockerfile.
    location /.well-known/ {
        try_files $uri =404;
    }

    # SPA: an unknown path is a client route, not a 404. Assets still 404 because
    # they are matched by the block above and fall through to the real filesystem.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nothing here needs to identify its own version to the internet.
    server_tokens off;
}
