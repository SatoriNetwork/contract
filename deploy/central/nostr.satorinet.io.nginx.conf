    # ---------------------------------------------------------------------
    # nostr.satorinet.io — Central's Nostr relay (strfry behind
    # satori-relay-nginx) at the root: wss://nostr.satorinet.io.
    # Not relay.satorinet.io: that name fronts the satorian relay on another box.
    # Inserted before the http block's closing brace in /root/nginx/nginx.conf
    # (DEPLOY-central.md §nginx).
    #
    # Test the handshake with `curl --http1.1`: over HTTP/2 Upgrade is dropped
    # and the relay answers a plain 200, which looks like a dead relay.
    # ---------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name nostr.satorinet.io;

        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/.well-known/acme-challenge/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name nostr.satorinet.io;

        ssl_certificate     /etc/letsencrypt/live/nostr.satorinet.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nostr.satorinet.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        set $satori_relay satori-relay-nginx;

        # A subscription is legitimately idle for long stretches; 60s would cut it.
        # Accept passes through untouched so NIP-11 (application/nostr+json) works.
        location / {
            proxy_pass http://$satori_relay:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
