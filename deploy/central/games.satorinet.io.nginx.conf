    # ---------------------------------------------------------------------
    # games.satorinet.io — the dapp's home: the dapp at /, the indexer at /api,
    # the gasless relayer at /relayer. daily. and game. redirect here, because
    # the in-browser wallet lives in per-origin storage: serving the dapp on
    # three origins would give each visitor three different wallets.
    # One cert (name games.satorinet.io) covers all three names.
    # Inserted before the http block's closing brace in /root/nginx/nginx.conf
    # (DEPLOY-central.md §nginx).
    # ---------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name games.satorinet.io daily.satorinet.io game.satorinet.io;

        # Renewal goes through webroot for all three names.
        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/.well-known/acme-challenge/;
        }

        location / {
            return 301 https://games.satorinet.io$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name daily.satorinet.io game.satorinet.io;

        ssl_certificate     /etc/letsencrypt/live/games.satorinet.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/games.satorinet.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        return 301 https://games.satorinet.io$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name games.satorinet.io;

        ssl_certificate     /etc/letsencrypt/live/games.satorinet.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/games.satorinet.io/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # No X-Frame-Options: the dapp is framed as a Base Mini App. No HSTS yet:
        # a year-long HTTPS pin turns any future cert problem into a hard outage.
        add_header X-Content-Type-Options "nosniff" always;

        client_max_body_size 10m;

        # Upstreams are variables so nginx re-resolves them per request (the http
        # block sets `resolver 127.0.0.11`); a literal name is cached at startup
        # and 502s after a container restart. With a variable, proxy_pass no
        # longer strips the location prefix, hence the explicit rewrites.
        set $satori_ui      satori-ui;
        set $satori_indexer satori-indexer;
        set $satori_gasless satori-gasless-relayer;

        location /api/ {
            limit_req zone=network_limitreq burst=100 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$satori_indexer:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /relayer/ {
            limit_req zone=network_limitreq burst=50 nodelay;

            rewrite ^/relayer/(.*)$ /$1 break;
            proxy_pass http://$satori_gasless:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location / {
            proxy_pass http://$satori_ui:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
        }
    }
