    # ---------------------------------------------------------------------
    # index.satorinet.io — the Satori indexer at the root (/status, /streams…).
    # The dapp calls the same service same-origin at games.satorinet.io/api.
    # Inserted before the http block's closing brace in /root/nginx/nginx.conf
    # (DEPLOY-central.md §nginx).
    # ---------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name index.satorinet.io;

        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/.well-known/acme-challenge/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name index.satorinet.io;

        ssl_certificate     /etc/letsencrypt/live/index.satorinet.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/index.satorinet.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header X-Content-Type-Options "nosniff" always;

        set $satori_indexer satori-indexer;

        location / {
            limit_req zone=network_limitreq burst=100 nodelay;

            proxy_pass http://$satori_indexer:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
