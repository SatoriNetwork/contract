    # ---------------------------------------------------------------------
    # app.satorinet.io — free for a new use (2026-10-23). Until then it only
    # redirects what used to live here: /api/* to index.satorinet.io, the rest
    # to the dapp at games.satorinet.io. The Nostr relay that sat at /relay is
    # wss://nostr.satorinet.io (WebSocket clients do not follow redirects).
    # Inserted before the http block's closing brace in /root/nginx/nginx.conf
    # (DEPLOY-central.md §nginx).
    # ---------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name app.satorinet.io;

        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/.well-known/acme-challenge/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name app.satorinet.io;

        ssl_certificate     /etc/letsencrypt/live/app.satorinet.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.satorinet.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /api/ {
            rewrite ^/api/(.*)$ https://index.satorinet.io/$1 permanent;
        }

        location / {
            return 301 https://games.satorinet.io$request_uri;
        }
    }
