    # ---------------------------------------------------------------------
    # app.satorinet.io — the Satori dapp, its indexer, and a Nostr relay, all
    # on ONE origin. Appended to /root/nginx/nginx.conf on Satori Central.
    #
    # One host rather than app/api/relay subdomains: one certificate, one
    # server block, and the dapp calls the indexer same-origin so CORS and
    # mixed-content stop being things anyone has to think about. The cost is
    # that all three now move together — splitting them later means new names,
    # new certs, and a dapp rebuild, because the indexer URL is BAKED INTO the
    # bundle at build time (satori-ui/src/contracts/addresses.ts).
    # ---------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name app.satorinet.io;

        # Renewal. certbot --webroot writes here and nginx-proxy mounts
        # /var/www/certbot read-only, same as network.satorinet.io.
        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/.well-known/acme-challenge/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name app.satorinet.io;

        ssl_certificate     /etc/letsencrypt/live/app.satorinet.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.satorinet.io/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # No X-Frame-Options DENY/SAMEORIGIN here on purpose: the dapp is
        # embedded as a Base Mini App, and framing it is the point.
        add_header X-Content-Type-Options "nosniff" always;

        # NOT set: Strict-Transport-Security. network.satorinet.io sends HSTS
        # with includeSubDomains, but that covers ITS subdomains, not this
        # sibling. Adding it here would pin app.satorinet.io to HTTPS in every
        # visitor's browser for a year, which turns any future cert or host
        # problem into a hard outage with no way to fall back. Worth turning on
        # deliberately once this host has settled — not as a side effect.

        client_max_body_size 10m;

        # Upstreams resolved at REQUEST time, not startup. The http block sets
        # `resolver 127.0.0.11` (Docker's embedded DNS) precisely because nginx
        # otherwise caches a container's IP forever and 502s after any restart
        # — the same trap the central-lite upstream documents. A variable in
        # proxy_pass is what forces the re-resolution.
        set $satori_ui      satori-ui;
        set $satori_indexer satori-indexer;
        set $satori_relay   satori-relay-nginx;
        set $satori_gasless satori-gasless-relayer;

        # --- the indexer, same-origin at /api ------------------------------
        # The prefix is stripped by an explicit `rewrite`, NOT by a trailing
        # slash on proxy_pass. That is forced by the variable upstream above:
        # nginx only substitutes the matched location prefix when proxy_pass
        # has a literal URI, and with a variable it passes the URI through
        # verbatim — so `proxy_pass http://$var:8787/` sends "/" for every
        # request and the indexer answers "Cannot GET /" no matter what was
        # asked for. `break` stops rewrite processing so this stays in-location.
        location /api/ {
            limit_req zone=network_limitreq burst=100 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$satori_indexer:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --- the Nostr relay at /relay -------------------------------------
        # WebSocket, so Upgrade/Connection must be passed through and the read
        # timeout has to outlive an idle subscription — a relay connection is
        # legitimately quiet for long stretches, and the default 60s would
        # disconnect subscribers who are behaving correctly.
        #
        # The relay's own nginx also answers NIP-11 on this path when the
        # request carries `Accept: application/nostr+json`, which is why the
        # Accept header is forwarded untouched.
        # The rewrite is the same variable-upstream correction as /api/: without
        # it the relay's own nginx receives "/relay" rather than "/". strfry
        # tolerates the stray path, so this is hygiene rather than a fix — the
        # relay answered correctly either way.
        #
        # When testing the handshake, use `curl --http1.1`. This block sets
        # `http2 on`, curl negotiates HTTP/2 by default, and Connection/Upgrade
        # are not valid HTTP/2 headers — so the request degrades to an ordinary
        # GET and returns 200, which looks exactly like a broken relay. Over
        # HTTP/1.1 the same request returns 101. Browsers open wss:// over
        # HTTP/1.1, so 200-on-h2 is a curl artifact, not a defect.
        location /relay {
            rewrite ^/relay/?(.*)$ /$1 break;
            proxy_pass http://$satori_relay:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # --- the gasless relayer at /relayer -------------------------------
        # Same variable-upstream + rewrite correction as /api/: the prefix is
        # stripped by the rewrite (not a trailing slash on proxy_pass, which a
        # variable upstream ignores), so the service receives its own
        # /gasless/quote|submit|tx paths. The dapp posts a signed RelayRequest;
        # this is a plain JSON POST, no WebSocket, so the /api/ block is the
        # right template, not /relay. NOT the Nostr relay (satori-relay-*): this
        # is the gas-fee relayer (satori-gasless-relayer).
        location /relayer/ {
            limit_req zone=network_limitreq burst=50 nodelay;

            rewrite ^/relayer/(.*)$ /$1 break;
            proxy_pass http://$satori_gasless:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # --- the dapp ------------------------------------------------------
        # Last, so /api/ and /relay win. The SPA's own nginx inside the image
        # does the try_files fallback to index.html for client-side routes.
        location / {
            proxy_pass http://$satori_ui:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
        }
    }
